[package]
name = "shipping"
edition = "2021"

[[bin]]
name = "shipping"
path = "src/main.rs"

[dependencies]
actix-web = "4"
# actix-web = { version = "4.0", default-features = false, features = [
#   "compress-zstd",
# ] }
anyhow = "1.0.99"
awc = { version = "3.8.0", default-features = false, features = ["compress-zstd"] }
serde = { version = "1.0.225", features = ["derive"] }
tonic = "0.14.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = [
"spec_unstable_metrics_views",
"metrics",
] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
opentelemetry-instrumentation-actix-web = {  path = "/Users/coam/Test/opentelemetry-rust-contrib/opentelemetry-instrumentation-actix-web/.", features = [
  "metrics",
  "sync-middleware",
  "awc",
] }
opentelemetry-appender-tracing = "0.31.0"
opentelemetry-resource-detectors = "0.9.0"
# opentelemetry-stdout = "0.31"
opentelemetry-stdout = { version = "0.31", features = ["trace", "metrics"] }

tracing-opentelemetry = "0.31.0"

[dependencies.uuid]
version = "1.18.1"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]
